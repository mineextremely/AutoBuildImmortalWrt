name: build-rootfs-25.12.x

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本 (SNAPSHOT/25.12-SNAPSHOT 为快照源，包名变动可能导致构建失败)"
        required: false
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0-rc1
          - 25.12.0-rc2
          - 25.12.0
          - 25.12.1
          - 25.12.2
          - SNAPSHOT
          - 25.12-SNAPSHOT
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      rootfs_partsize:
        description: "rootfs 分区大小(MB)"
        required: true
        default: "1024"
        type: choice
        options:
          - '1024'
          - '2048'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build25.sh

      - name: 解析版本与 ImageBuilder 镜像标签
        run: |
          # 镜像标签映射：SNAPSHOT=master 快照，25.12-SNAPSHOT=25.12 分支快照，两者标签不同不可合并
          # 注意快照标签没有 openwrt- 中缀，且 SNAPSHOT 为小写
          # NORMALIZED 供后续改名的步骤使用（经 $GITHUB_ENV 传递）
          # 变量名必须与 shell 中引用的大小写完全一致：小写 normalized 注入后
          # 读不到 $NORMALIZED，会导致产物名缺失版本串（immortalwrt--armsr-armv8-...）
          LUCI_VERSION="${{ github.event.inputs.luci_version }}"
          case "$LUCI_VERSION" in
            SNAPSHOT|25.12-SNAPSHOT)
              NORMALIZED="snapshot"
              ;;
            *)
              NORMALIZED="$LUCI_VERSION"
              ;;
          esac
          echo "luci_version=$LUCI_VERSION"
          echo "normalized=$NORMALIZED"
          echo "NORMALIZED=$NORMALIZED" >> $GITHUB_ENV

      - name: Building armsr-armv8 rootfs 25.12.x
        run: |
          echo "✅ Using ImageBuilder to build rootfs"
          profile="generic"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          # IMAGE_TAG 必须在本步骤内解析：$GITHUB_ENV 写入的变量只对后续步骤生效，
          # 不会导出进当前 shell，跨步骤直接引用会得到空值（docker: invalid reference format）
          case "${{ github.event.inputs.luci_version }}" in
            SNAPSHOT)       IMAGE_TAG="armsr-armv8-snapshot" ;;
            25.12-SNAPSHOT) IMAGE_TAG="armsr-armv8-25.12-SNAPSHOT" ;;
            *)              IMAGE_TAG="armsr-armv8-openwrt-${{ github.event.inputs.luci_version }}" ;;
          esac
          echo "使用镜像: immortalwrt/imagebuilder:${IMAGE_TAG}"

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/armsr-armv8/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e INCLUDE_DOCKER=$include_docker \
            -e ROOTFS_PARTSIZE=$rootfs_partsize \
            immortalwrt/imagebuilder:${IMAGE_TAG} /bin/bash /home/build/immortalwrt/build.sh

      - name: Find rootfs.tar.gz and rename
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ rootfs.tar.gz not found!"
            exit 1
          fi
          OUTPUT_NAME="immortalwrt-${NORMALIZED}-armsr-armv8-generic-rootfs.tar.gz"
          OUTPUT_PATH="bin/targets/armsr/armv8/${OUTPUT_NAME}"
          if [ "$(basename "$ROOTFS_FILE")" != "$OUTPUT_NAME" ]; then
            # ImageBuilder 在容器内以 --user root 运行，bin/ 下的目录属主是 root，
            # 而本步骤以 runner 身份执行。同目录内改名需要对目录有写权限 → 必须 sudo。
            # 只有快照构建会走到这里：快照镜像的 IMG_PREFIX 不含版本号，
            # 产出名与 OUTPUT_NAME 不同；版本固定的构建两者本就相同，不执行改名。
            sudo mv "$ROOTFS_FILE" "$OUTPUT_PATH"
            echo "Renamed to: ${OUTPUT_NAME}"
          else
            echo "Already named: ${OUTPUT_NAME}"
          fi
          echo "output_file=${OUTPUT_PATH}" >> $GITHUB_OUTPUT

      - name: Upload rootfs to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rootfs
          name: ImmortalWrt armsr-armv8 rootfs
          body: |
            ImmortalWrt armsr-armv8 预构建 rootfs.tar.gz

            - **24.10.x**: `immortalwrt-24.10.x-armsr-armv8-generic-rootfs.tar.gz`
            - **25.12.x**: `immortalwrt-25.12.x-armsr-armv8-generic-rootfs.tar.gz`
            - **快照**: `immortalwrt-snapshot-armsr-armv8-generic-rootfs.tar.gz`

            供 N1/ophub boxs 工作流的 `skip_imagebuilder` 模式使用。
          files: |
            ${{ steps.find_rootfs.outputs.output_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
